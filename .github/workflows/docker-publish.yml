# Build the Docker images and publish them on GitHub Container Registry (ghcr.io).
#
#   push on develop/master/main -> tags :latest, :<branch> and :sha-xxxxxxx
#   push of a tag v1.2.3  -> tags :1.2.3 and :1.2
#   manual run            -> "Actions" tab > "Publish Docker images" > Run workflow
#
# Then on any machine:  docker compose pull && docker compose up -d
name: Publish Docker images

on:
  push:
    branches: [develop, master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # Needed to push to ghcr.io with the built-in GITHUB_TOKEN

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend.Dockerfile
          - name: frontend
            dockerfile: docker/frontend.Dockerfile

    steps:
      - uses: actions/checkout@v4

      # The backend image is big (PyTorch): free some disk on the runner
      - name: Free disk space
        if: matrix.name == 'backend'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io needs a lower case owner name
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plateforme-ia-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

# nginx config of the frontend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The two API routes go to the backend container
    location ~ ^/(question|response)(/|$) {
        proxy_pass http://backend:4444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 1m;
    }

    # Built JS/CSS files have a hash in their name: cache them for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the single page app
    location / {
        try_files $uri /index.html;
    }
}

# ==========================================================================
# GPU add-on (NVIDIA). Needs the NVIDIA driver + NVIDIA Container Toolkit.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
# ==========================================================================

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-cuda-build: &cuda-build
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
    args:
      # PyTorch built for CUDA 12.4
      TORCH_INDEX_URL: https://download.pytorch.org/whl/cu124

services:
  model:
    <<: *cuda-build

  backend:
    <<: [*cuda-build, *gpu]
    environment:
      DEVICE: cuda
